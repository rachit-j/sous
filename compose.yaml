services:
  sous:
    build: .
    image: sous:local
    restart: unless-stopped
    # Local-only MVP: reachable from this machine, not the network.
    ports:
      - "127.0.0.1:${SOUS_PORT:-5050}:5000"
    volumes:
      - sous-instance:/app/instance
    # Lets in-flight analysis finish (gunicorn graceful timeout is 210 s).
    stop_grace_period: 220s

volumes:
  sous-instance:
