name: CI and publish

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, feature/github-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit and synthetic WebSocket tests
        env:
          SOUS_VOICE_SOCKET_TESTS: '1'
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/voice.js
          node --check static/voice-worklet.js

  image:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: sous:ci
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose and smoke-test runtime
        env:
          SOUS_IMAGE: sous:ci
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker run -d --name sous-ci -p 127.0.0.1:5051:5000 sous:ci
          # Docker may accept the TCP connection before Gunicorn is ready and
          # reset it; retry startup resets as well as refused connections.
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:5051/healthz; then
            docker logs sous-ci
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5051/api/config > /dev/null
      - name: Remove disposable smoke container
        if: always()
        run: docker rm -fv sous-ci 2>/dev/null || true
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:$GITHUB_SHA"
          docker tag sous:ci "$image"
          docker push "$image"
          reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Published \`$image\` (\`$reference\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: sous-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sous' }}
      DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'sous' }}
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate deployment settings
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          [[ "$DEPLOY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$IMAGE_REFERENCE" =~ ^ghcr.io/[a-z0-9_./-]+@sha256:[a-f0-9]{64}$ ]]
      - name: Configure SSH with a pinned server host key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload release configuration and deploy
        run: |
          # A queued older build must not replace a newer main revision.
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo 'Skipped superseded main revision.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" "mkdir -p '$release'"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes compose.yaml compose.production.yaml deploy/deploy.sh "$target:$release/"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" "bash '$release/deploy.sh' '$DEPLOY_PATH' '$GITHUB_SHA' '$IMAGE_REFERENCE' '$DEPLOY_PROJECT'"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
